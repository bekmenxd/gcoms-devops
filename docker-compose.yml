version: "3.9"

services:
  backend:
    build:
      context: ../gcoms-public-backend
    volumes:
      - ../gcoms-public-backend:/src
    ports:
      - "3001:3001"
    environment:
      - TSX_WATCH_POLL=1
      - BOT_API_URL=http://bot:3000
    env_file:
      - ../gcoms-public-backend/.env
    depends_on:
      - bot
      - mongo

  bot:
    build:
      context: ../gcoms-public-bot
    volumes:
      - ../gcoms-public-bot/src:/src
      - /src/node_modules
      - ../gcoms-public-bot/package.json:/src/package.json:ro
      - ../gcoms-public-bot/package-lock.json:/src/package-lock.json:ro
    ports:
      - "3002:3000"
    environment:
      - PORT=3000
      # Explicit now that the bot requires MONGODB_URI (no more silent
      # fallback to this same value baked into the code -- see the
      # kubernetes-migration branch). This is compose-network wiring, the
      # same category as backend's BOT_API_URL above, so it belongs here
      # rather than in the per-developer .env file.
      - MONGODB_URI=mongodb://mongo:27017/gamercoms
    env_file:
      - ../gcoms-public-bot/.env
    depends_on:
      - mongo

  frontend:
    build:
      context: ../Gamercoms-web
    volumes:
      - ../Gamercoms-web:/app
      - /app/node_modules # undvik att skriva över node_modules från host
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:3001
      - WATCHPACK_POLLING=true
      # NEXT_PUBLIC_DISCORD_BOT_CLIENT_ID is intentionally NOT set here so it is
      # read from Gamercoms-web/.env.local. A value set in this environment block
      # becomes a real env var and would override .env.local — Next.js never
      # overwrites an already-set process.env var. Set the local TEST bot id in
      # .env.local. Production omits it and falls back to the prod app id in
      # src/lib/discord.ts.
    depends_on:
      - backend

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
