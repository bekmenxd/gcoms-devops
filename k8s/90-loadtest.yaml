# Parallel, disposable load-test resources -- NEVER applied as part of the
# normal numbered k8s/ apply sequence (hence "90-", outside the real
# 00-20 order, and deliberately not referenced from k8s/README.md).
# Applied and deleted manually, by hand, only for a load-test run:
#
#   kubectl apply -f k8s/90-loadtest.yaml
#   ... run the test ...
#   kubectl delete -f k8s/90-loadtest.yaml
#
# (equivalently: `kubectl delete deployment,service,networkpolicy,ingress
# -n gamercoms -l loadtest=true` -- everything below carries that label)
#
# Design, see gcoms-dir/CLAUDE.md's load-testing note for the full reasoning:
#   - Runs ALONGSIDE the real bot/backend/frontend Deployments, never
#     replacing them -- the real bot's Discord gateway session and any real
#     (if minimal) staging traffic are untouched.
#   - Shares the REAL staging Mongo (the actual resource under test) via the
#     same operator-generated secret the real Deployments use.
#   - bot-loadtest runs the images built from the `loadtest/dry-run-mode`
#     branches (gcoms-public-bot / gcoms-public-backend), tagged
#     `loadtest-<shortsha>` in ghcr.io -- LOAD_TEST_MODE=true skips
#     client.login() entirely (no gateway connection attempted at all, so
#     zero risk of colliding with the real bot's singleton session).
#   - Routed through the REAL ingress-nginx/NodeBalancer via a SEPARATE
#     Ingress object (not editing the real `gamercoms-staging` Ingress) on a
#     new path off the already Cloudflare-covered `staging.gamercoms.com`
#     host -- sidesteps the api.staging.gamercoms.com Cloudflare edge-cert
#     gap entirely. Deliberately a SEPARATE Ingress resource rather than a
#     new path on the existing one for a second reason found while building
#     this: the real Ingress carries `nginx.ingress.kubernetes.io/limit-rps:
#     "20"` (burst x3) -- a real per-source-IP rate limit that would throttle
#     our own orchestrator's traffic before it ever reached backend-loadtest
#     if we shared that Ingress object. ingress-nginx's rate-limit
#     annotations are scoped per Ingress resource, so a separate object with
#     no such annotation is genuinely unthrottled, without touching the real
#     one's config at all.
#   - Needs its OWN NetworkPolicies: the real ones are labelSelector-scoped
#     (app: backend / app: bot / app: mongo) and would otherwise block these
#     pods from reaching Mongo, or bot-loadtest from backend-loadtest,
#     entirely. Deliberately ADDITIVE new policy objects (NetworkPolicies
#     targeting the same pods are unioned, not replaced) rather than editing
#     the real ones -- and deliberately a DIFFERENT `app` label
#     (bot-loadtest / backend-loadtest, not bot / backend) so the real
#     bot/backend Services' selectors can never accidentally start routing
#     to a load-test pod.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-loadtest
  namespace: gamercoms
  labels:
    app: bot-loadtest
    loadtest: "true"
spec:
  # Fixed at 1 for Phase 1 (matches the real bot's hard single-instance
  # constraint -- even though bot-loadtest itself has no gateway session to
  # collide over, testing at the same replica count the real bot can ever
  # actually run at is what makes the result meaningful). Scaled manually
  # (kubectl scale) if Phase 2 ever wants to explore beyond that as a
  # hypothetical -- not because production could ever use it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bot-loadtest
  template:
    metadata:
      labels:
        app: bot-loadtest
        loadtest: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: bot-loadtest
          image: ghcr.io/bekmenxd/gcoms-public-bot:loadtest-278d876
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: gamercoms-config
            - secretRef:
                name: gamercoms-secrets
          env:
            - name: LOAD_TEST_MODE
              value: "true"
            # 2026-09-16: raised 40->300 specifically on bot-loadtest to test
            # whether Mongo connection-pool exhaustion explains the 8k-user
            # bottleneck -- bot CPU never exceeds ~40-50% of its limit under
            # this load, yet EVERY route (including plain reads unrelated to
            # the create/join write paths) shows multi-second p50 latency in
            # the bot's own request logs. Low CPU + uniformly slow across
            # unrelated routes is the signature of requests queueing for a
            # free DB connection, not CPU-bound work. See
            # gcoms-dir/CLAUDE.md's load-testing note.
            - name: MONGO_MAX_POOL_SIZE
              value: "300"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-gamercoms-gamercoms
                  key: connectionString.standard
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            # Explicit, not k8s's 1s default. Without this, a merely-slow pod
            # gets pulled from rotation mid-run and the ingress serves 503s --
            # which measures the probe bug, not capacity. Same fix as
            # gcoms-devops PR #6 applies to the real Deployments.
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            # Bumped 3x from the real bot's 250m/500m (2026-09-14) to test
            # whether bot-loadtest's CPU limit -- not replica count, which is
            # permanently fixed at 1 by Discord's gateway constraint -- was
            # really the Step E (3000 users) ceiling. Node allocatable is
            # 1930m per node, so this still leaves headroom. NOT applied to
            # the real bot's k8s/12-bot.yaml -- that's a separate, deliberate
            # decision to make only after this confirms it actually helps.
            requests:
              cpu: "500m"
              memory: "192Mi"
            limits:
              cpu: "1500m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bot-loadtest
  namespace: gamercoms
  labels:
    loadtest: "true"
spec:
  selector:
    app: bot-loadtest
  ports:
    - port: 3000
      targetPort: 3000
---
# PoC: the scalable half of the api/gateway service split (gcoms-public-bot
# branch `poc/api-gateway-split`). Same image as bot-loadtest above -- the
# ONLY difference is the `command` override selecting a different entrypoint,
# which is deliberate: one image and one CI pipeline keeps this PoC cheap to
# build and trivial to throw away if the numbers don't justify it.
#
# entrypoints/api.js runs Mongo + the internal HTTP API and never opens a
# gateway session, so unlike bot-loadtest this Deployment is safe to scale.
# That is the entire hypothesis under test: load testing confirmed the single
# bundled bot process was the ~8k-concurrent-user ceiling, and Discord's
# one-session-per-token rule constrains only the gateway, not REST calls or
# Mongo access. See gcoms-dir/CLAUDE.md's load-testing note.
#
# The gateway half (entrypoints/gateway.js) is deliberately NOT deployed here:
# under LOAD_TEST_MODE it holds a fake client and skips the background jobs,
# so it would be a near-no-op pod competing for scarce node headroom and
# skewing the very measurement this exists to take. It was verified to boot
# and serve /health locally instead (and to correctly 404 on /api/v1/queues,
# confirming the queue API really isn't served there).
#
# To A/B against the bundled baseline, point backend-loadtest's BOT_API_URL at
# `http://bot-loadtest:3000` (bundled) or `http://bot-api-loadtest:3000`
# (split) -- one env var, no other change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-api-loadtest
  namespace: gamercoms
  labels:
    app: bot-api-loadtest
    loadtest: "true"
spec:
  # Starts at 1 so the first comparison is like-for-like against
  # bot-loadtest's single replica: does splitting ALONE help, before any
  # scaling? Then scaled up (kubectl scale) to measure what the split
  # actually unlocks -- the thing bot-loadtest can never do.
  replicas: 1
  selector:
    matchLabels:
      app: bot-api-loadtest
  template:
    metadata:
      labels:
        app: bot-api-loadtest
        loadtest: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: bot-api-loadtest
          image: ghcr.io/bekmenxd/gcoms-public-bot:loadtest-6a2b92e
          imagePullPolicy: Always
          # The one thing that makes this a different service from
          # bot-loadtest. dockerfile.prod's CMD is `node src/index.js`
          # (gateway + API bundled); this selects the api-only entrypoint.
          command: ["node", "src/entrypoints/api.js"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: gamercoms-config
            - secretRef:
                name: gamercoms-secrets
          env:
            # entrypoints/api.js refuses to start without this, by design:
            # outside load-test mode it would need a REST-backed client shim
            # (phase 2) and would otherwise open a second real gateway
            # session on the shared token.
            - name: LOAD_TEST_MODE
              value: "true"
            - name: MONGO_MAX_POOL_SIZE
              value: "300"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-gamercoms-gamercoms
                  key: connectionString.standard
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            # Explicit rather than k8s's 1s default -- the same probe-timeout
            # problem found on the real Deployments (gcoms-devops PR #6);
            # without this a merely-slow pod gets pulled from rotation mid
            # load test and corrupts the measurement.
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            # Matches bot-loadtest exactly so per-replica capacity is
            # comparable and the only variable is the split itself.
            requests:
              cpu: "500m"
              memory: "192Mi"
            limits:
              cpu: "1500m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: bot-api-loadtest
  namespace: gamercoms
  labels:
    loadtest: "true"
spec:
  selector:
    app: bot-api-loadtest
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-loadtest
  namespace: gamercoms
  labels:
    app: backend-loadtest
    loadtest: "true"
spec:
  # Phase 1 baseline: matches the real backend HPA's minReplicas (2) -- "today's
  # exact deployed capacity, no scaling." Phase 2 scales this manually
  # (kubectl scale deployment/backend-loadtest --replicas=N) one step at a
  # time up toward the real HPA's max (6), recording throughput at each step.
  replicas: 2
  selector:
    matchLabels:
      app: backend-loadtest
  template:
    metadata:
      labels:
        app: backend-loadtest
        loadtest: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend-loadtest
          image: ghcr.io/bekmenxd/gcoms-public-backend:loadtest-ca981b3
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: gamercoms-config
            - secretRef:
                name: gamercoms-secrets
          env:
            - name: LOAD_TEST_MODE
              value: "true"
            # Overrides the ConfigMap's http://bot:3000 -- must talk to a
            # load-test service, never the real bot.
            #
            # THIS IS THE A/B SWITCH for the service-split PoC:
            #   http://bot-loadtest:3000      bundled baseline (gateway + API
            #                                 in one process, capped at 1)
            #   http://bot-api-loadtest:3000  split (scalable api-only tier)
            #
            # Set here rather than via `kubectl set env`, because any later
            # `kubectl apply -f` of this file silently reverts an imperative
            # override back to whatever this line says -- which already
            # invalidated one PoC run before it was noticed.
            - name: BOT_API_URL
              value: http://bot-api-loadtest:3000
            # 2026-09-16: raised 40->300 to match bot-loadtest. Profiling
            # proved pool exhaustion was real (not the earlier "refuted"
            # conclusion, which had only compared aggregate error rates
            # rather than decomposing where the latency actually sat) --
            # but fixing the bot's pool just moved the bottleneck here, and
            # backend then failed its own health checks under the same load.
            # See gcoms-dir/CLAUDE.md's load-testing note.
            - name: MONGO_MAX_POOL_SIZE
              value: "300"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-gamercoms-gamercoms
                  key: connectionString.standard
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            # Explicit, not k8s's 1s default. Without this, a merely-slow pod
            # gets pulled from rotation mid-run and the ingress serves 503s --
            # which measures the probe bug, not capacity. Same fix as
            # gcoms-devops PR #6 applies to the real Deployments.
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            # Bumped 3x from the real backend's 250m/750m (2026-09-14),
            # mirroring the bot-loadtest CPU fix -- backend-loadtest peaked
            # at 645m/750m (86%) once the index fix + pool increase let more
            # real traffic through at 10k users. Node allocatable is 1930m
            # per node, headroom exists. NOT applied to the real backend's
            # k8s/11-backend.yaml -- separate, deliberate decision later.
            requests:
              cpu: "250m"
              memory: "192Mi"
            limits:
              cpu: "2250m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-loadtest
  namespace: gamercoms
  labels:
    loadtest: "true"
spec:
  selector:
    app: backend-loadtest
  ports:
    - port: 3001
      targetPort: 3001
---
# Additive: Mongo already has a policy from the real manifests
# (mongo-allow-app-and-backup-only); NetworkPolicies targeting the same pods
# are unioned across objects, not replaced, so this only ADDS the
# loadtest-labeled pods to what's allowed -- the real policy is untouched.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-allow-loadtest
  namespace: gamercoms
  labels:
    loadtest: "true"
spec:
  podSelector:
    matchLabels:
      app: mongo
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bot-loadtest
        - podSelector:
            matchLabels:
              app: backend-loadtest
        # The split PoC's api tier reads/writes Mongo directly -- that is
        # precisely what lets it scale without a gateway session.
        - podSelector:
            matchLabels:
              app: bot-api-loadtest
      ports:
        - port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bot-loadtest-allow-backend-loadtest
  namespace: gamercoms
  labels:
    loadtest: "true"
spec:
  podSelector:
    matchLabels:
      app: bot-loadtest
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend-loadtest
      ports:
        - port: 3000
---
# Same as the policy above, for the split PoC's api tier -- backend-loadtest
# talks to whichever of the two its BOT_API_URL points at, so both need to
# accept it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bot-api-loadtest-allow-backend-loadtest
  namespace: gamercoms
  labels:
    loadtest: "true"
spec:
  podSelector:
    matchLabels:
      app: bot-api-loadtest
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend-loadtest
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-loadtest-allow-ingress
  namespace: gamercoms
  labels:
    loadtest: "true"
spec:
  podSelector:
    matchLabels:
      app: backend-loadtest
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 3001
---
# Separate Ingress object (see the file-level comment for why: sidesteps the
# real Ingress's 20rps rate-limit annotation and the api.staging Cloudflare
# edge-cert gap in one move, at zero risk to the real Ingress object since
# nothing about it is edited). Same host as the real, working
# staging.gamercoms.com -- Cloudflare already has a valid edge cert for it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamercoms-staging-loadtest
  namespace: gamercoms
  labels:
    loadtest: "true"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Deliberately NO limit-rps/limit-burst-multiplier annotations here --
    # this test exists specifically to find the real backend/Mongo ceiling,
    # not nginx's configured guard-rail for real user traffic.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.gamercoms.com
      secretName: gamercoms-web-staging-tls
  rules:
    - host: staging.gamercoms.com
      http:
        paths:
          - path: /loadtest-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-loadtest
                port:
                  number: 3001
