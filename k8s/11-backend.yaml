apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gamercoms
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Matches dockerfile.prod's non-root `appuser` (uid/gid 1001).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      # See the matching comment in 10-frontend.yaml -- only needed if the
      # ghcr.io package stays private.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: REGISTRY_PLACEHOLDER/gcoms-public-backend:TAG_PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: gamercoms-config
            - secretRef:
                name: gamercoms-secrets
          env:
            # Sourced from the MongoDBCommunity operator's own generated
            # Secret (k8s/13-mongo.yaml), not hand-filled in
            # 02-secret.example.yaml -- the operator creates
            # "<mongo CR name>-<user.name>-<user.db>" with this key once the
            # replica set is up. Name below matches the CR as written
            # (`mongo` / user `gamercoms` / db `gamercoms`); if any of those
            # three ever change, this secretKeyRef must change with them.
            # CONFIRM the exact secret name against `kubectl get secrets -n
            # gamercoms` once the operator has actually reconciled -- this is
            # the operator's documented naming convention, not something
            # verified against a live cluster yet.
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-gamercoms-gamercoms
                  key: connectionString.standard
          # Readiness checks Mongo (/health); liveness only confirms the
          # process is still accepting connections. Reusing /health for
          # liveness would restart every backend pod on a transient Mongo
          # blip instead of just pulling it from rotation until it recovers
          # -- see the same reasoning in k8s/12-bot.yaml.
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gamercoms
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
---
# Now safe to autoscale: the two High-severity fixes that made replicas > 1
# unsafe (in-memory create-queue cooldown, missing bot-call timeouts) have
# already landed on the app-code kubernetes-migration branches. CPU target
# and min/max below are starting points, not measured -- revisit once this
# is actually running under real traffic.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: gamercoms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
