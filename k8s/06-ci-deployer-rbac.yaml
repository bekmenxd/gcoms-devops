# Scoped identity for GitHub Actions deploy workflows -- deliberately NOT
# the full-admin kubeconfig used for manual kubectl/helm work from the Pi.
# CI only ever needs to change which image tag a Deployment runs and check
# whether that rollout succeeded; it has no business being able to touch
# Secrets, delete namespaces, or anything else the admin kubeconfig can do.
# If a CI secret ever leaks, blast radius is "can redeploy the app tier,"
# not "owns the cluster."
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: gamercoms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: gamercoms
rules:
  # kubectl set image + kubectl rollout status/undo/history need exactly
  # these three verbs on these three resource kinds, nothing more.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: gamercoms
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: gamercoms
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
---
# The credential the GitHub Actions KUBECONFIG secret is built from.
#
# This exists because `kubectl create token` mints a time-limited token: the
# original staging KUBECONFIG was made that way, so it carried an undocumented
# expiry that would eventually have broken every deploy with no warning and no
# obvious cause. A Secret of this type is filled in by the token controller and
# does NOT expire, which is what a long-lived CI credential needs.
#
# Committing this file is safe even though this repo is public: the manifest
# contains no token. The controller populates `data.token` and `data.ca.crt` in
# the cluster; nothing sensitive is written back here.
#
# To rebuild the kubeconfig (e.g. after rotating the credential by deleting and
# re-applying this Secret), read `token` and `ca.crt` out of it and assemble a
# kubeconfig pointing at the cluster's API server, then set it as the KUBECONFIG
# secret on each repo's staging AND production environments. Decode the fields
# with a real base64 decoder, never shell pipelines -- `grep | cut | tr` has
# silently corrupted a credential in this project before.
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: gamercoms
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
