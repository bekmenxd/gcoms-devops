apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gamercoms
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: REGISTRY_PLACEHOLDER/gamercoms-web:TAG_PLACEHOLDER
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: gamercoms-config
          # /api/health has no dependency checks (it's just confirming the
          # Next.js server itself is up), so readiness and liveness can
          # safely share it -- unlike backend/bot, there's no risk of a
          # transient dependency blip triggering an unwanted restart.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "300m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gamercoms
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
---
# Starting points, not measured -- revisit once this is running under real
# traffic (same caveat as backend's HPA).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: gamercoms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
