apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gamercoms
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Matches dockerfile.prod's non-root `nextjs` user (uid/gid 1001) --
      # belt-and-suspenders so a pod still refuses to run as root even if a
      # future image change drops the Dockerfile's USER line by accident.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      # Only needed if the ghcr.io package is left private (the default for
      # a package pushed via GITHUB_TOKEN from a private repo) -- skip this
      # and the Secret it references if the package is made public instead.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: REGISTRY_PLACEHOLDER/gamercoms-web:TAG_PLACEHOLDER
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: gamercoms-config
          # /api/health has no dependency checks (it's just confirming the
          # Next.js server itself is up), so readiness and liveness can
          # safely share it -- unlike backend/bot, there's no risk of a
          # transient dependency blip triggering an unwanted restart.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # Right-sized 2026-10-02 against measured production usage (~1m CPU / ~65Mi
          # observed per pod at live-but-quiet traffic). The old 300m was a
          # pre-launch guess, and it mattered: requests are reservations, so at
          # the HPA's max of 6 replicas the previous number alone would have
          # reserved 1800m -- more than the cluster had spare. That made the
          # configured max unreachable in practice.
          #
          # LIMITS ARE DELIBERATELY UNCHANGED, so burst capacity is identical;
          # only the floor the scheduler sets aside moved. The HPA keeps its
          # 2-6 range and 70% CPU target, which now triggers at 105m actual
          # per pod instead of 210m -- it scales a little sooner, but each
          # replica costs a third less to place, so a full scale-out finally
          # fits. Revisit once there is real sustained traffic to measure.
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gamercoms
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
---
# Starting points, not measured -- revisit once this is running under real
# traffic (same caveat as backend's HPA).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: gamercoms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
