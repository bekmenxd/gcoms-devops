# TEMPLATE ONLY -- every value below is a placeholder, never a real secret.
#
# Do not fill this file in and commit it. Instead:
#   cp k8s/02-secret.example.yaml k8s/02-secret.yaml
# fill in real values, and apply k8s/02-secret.yaml directly -- it's
# git-ignored (see .gitignore) so it can never be committed by accident.
#
# For anything beyond a single-operator setup, prefer not hand-editing a
# plaintext Secret file at all: use `kubectl create secret generic
# gamercoms-secrets --from-env-file=...` from a local .env that never touches
# git, or a proper secrets manager (External Secrets Operator, Sealed
# Secrets, or your cloud provider's secret store) instead of this file.
apiVersion: v1
kind: Secret
metadata:
  name: gamercoms-secrets
  namespace: gamercoms
type: Opaque
stringData:
  # Discord application credentials
  DISCORD_CLIENT_SECRET: "REPLACE_ME"
  DISCORD_API_TOKEN: "REPLACE_ME"

  # Auth token signing
  JWT_SECRET: "REPLACE_ME"
  JWT_REFRESH_SECRET: "REPLACE_ME"

  # Shared secret for backend<->bot internal API calls (requireInternalSecret).
  # Must be identical to what both the backend and bot containers receive --
  # they read the same key out of this one Secret, so keeping it in one place
  # instead of copy-pasted across two .env files removes a way for the two to
  # drift, unlike the old per-repo .env file setup.
  INTERNAL_API_SECRET: "REPLACE_ME"

  # Managed MongoDB connection string (mongodb+srv://... for Atlas). TLS and
  # auth are inferred from the URI itself -- no separate TLS config needed.
  MONGODB_URI: "REPLACE_ME"

  # RAWG.io games database API key (bot game-search + cache self-heal).
  RAWG_API_KEY: "REPLACE_ME"

  # HMACs Discord IDs before analytics capture -- required if POSTHOG_API_KEY
  # is set, otherwise unused.
  ANALYTICS_ID_SALT: "REPLACE_ME"

  # Borderline: not a credential by itself, but treat as secret rather than
  # leaving it in the plain ConfigMap.
  POSTHOG_API_KEY: ""
