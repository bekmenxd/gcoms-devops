# Replaces the host-level Nginx (SSL termination + gamercoms.com /
# api.gamercoms.com routing) that today lives only on the live server's
# /etc/nginx/sites-available -- NOT in this repo. Pull the real config off
# the server to confirm nothing beyond plain reverse-proxying is happening
# there before treating this as a complete replacement (see k8s/README.md).
#
# Assumes the ingress-nginx controller (`ingressClassName: nginx`) and
# cert-manager with a ClusterIssuer named `letsencrypt-prod` -- swap both if
# the cluster uses something else; neither is a code decision I can make for
# you.
#
# The bare-domain -> www redirect is NOT duplicated here: it's already
# handled at the application level in Gamercoms-web/src/middleware.ts, so
# both hosts below simply route to the frontend and the app does the 308.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamercoms
  namespace: gamercoms
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gamercoms.com
        - www.gamercoms.com
      secretName: gamercoms-web-tls
    - hosts:
        - api.gamercoms.com
      secretName: gamercoms-api-tls
  rules:
    - host: gamercoms.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: www.gamercoms.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.gamercoms.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
