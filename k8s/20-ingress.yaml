# First environment stood up on this cluster is staging, not production --
# staging.gamercoms.com / api.staging.gamercoms.com, not gamercoms.com /
# api.gamercoms.com. Nested-subdomain pattern (api.staging.*, not
# staging-api.*) chosen for consistency with the prod api.* convention --
# flag if a different scheme is preferred. No www host here: unlike prod,
# nothing redirects a bare staging domain to a www variant
# (Gamercoms-web/src/middleware.ts's redirect is hardcoded to the exact host
# `gamercoms.com`, so it doesn't fire for staging.gamercoms.com regardless --
# confirmed by reading the middleware, not assumed).
#
# Replaces the host-level Nginx (SSL termination + gamercoms.com /
# api.gamercoms.com routing) that today lives only on the live server's
# /etc/nginx/sites-available -- NOT in this repo, and not what this file
# targets anyway now that it's staging-first. Once staging is verified
# working, a second Ingress (or this one extended) covers the real
# gamercoms.com/api.gamercoms.com cutover -- pull the real prod Nginx config
# off the server before treating THAT as a complete replacement.
#
# Assumes the ingress-nginx controller (`ingressClassName: nginx`) and
# cert-manager with a ClusterIssuer named `letsencrypt-prod` -- swap both if
# the cluster uses something else; neither is a code decision I can make for
# you. Consider a `letsencrypt-staging` ClusterIssuer for this Ingress while
# still debugging DNS/ingress routing -- Let's Encrypt's production CA has a
# real per-domain rate limit that repeated failed attempts can burn through;
# switch to `letsencrypt-prod` once cert issuance is confirmed working.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamercoms-staging
  namespace: gamercoms
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Free alternative to a paid WAF/DDoS product (checked Akamai's own App &
    # API Protector -- enterprise/quote-based pricing, not self-serve, not
    # worth it at current traffic). Per-client-IP, per-controller-replica --
    # if the ingress-nginx controller itself is ever scaled to N replicas,
    # the effective limit multiplies by N. Starting point, not measured, same
    # caveat as the HPA thresholds elsewhere in this repo -- loosen or
    # tighten once this is running under real traffic.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.gamercoms.com
      secretName: gamercoms-web-staging-tls
    - hosts:
        - api.staging.gamercoms.com
      secretName: gamercoms-api-staging-tls
  rules:
    - host: staging.gamercoms.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.staging.gamercoms.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001
