# Non-secret configuration only. Anything token/credential-shaped belongs in
# 02-secret.example.yaml instead -- see k8s/README.md for the full split and
# the reasoning behind each variable's placement.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gamercoms-config
  namespace: gamercoms
data:
  NODE_ENV: "production"

  # Service-to-service URLs -- Compose service-name DNS maps 1:1 onto k8s
  # Service DNS within the same namespace, no other change needed.
  # Points at the SCALABLE half of the bot (k8s/12b-bot-api.yaml), not the
  # gateway half. `bot` holds Discord's one permitted gateway session and is
  # pinned to a single replica forever; `bot-api` serves this internal API and
  # scales, which is the entire point of the split.
  #
  # Cut over 2026-09-21 after bot-api was deployed and verified healthy
  # (role "api", gateway false, both replicas Ready). Reverting is this one
  # line back to "http://bot:3000" plus `kubectl rollout restart
  # deployment/backend` -- note the restart is required either way, since a
  # ConfigMap change does not propagate to already-running pods.
  BOT_API_URL: "http://bot-api:3000"
  BACKEND_API_URL: "http://backend:3001"
  # PRODUCTION cutover value. `www`, not the apex: the apex 301s to www and
  # Gamercoms-web's middleware 308-redirects it, so the apex is never the
  # origin a browser ends up on.
  #
  # This one variable does two jobs in the backend, and getting it wrong fails
  # closed in both:
  #   - it is the CORS `origin` (src/index.js), so a mismatch blocks every
  #     browser call from the site;
  #   - it builds the OAuth `redirect_uri` sent to Discord's token endpoint as
  #     `${FRONTEND_URL}/auth/discord/callback` (src/api/routes/v1/auth), which
  #     Discord matches EXACTLY -- so this string must be registered verbatim
  #     as a redirect URI on the application named in DISCORD_CLIENT_ID below.
  #
  # Changing it does not reach running pods; the backend needs a
  # `kubectl rollout restart` afterwards.
  FRONTEND_URL: "https://www.gamercoms.com"

  # Bot's own listen port (read via process.env.PORT).
  PORT: "3000"

  # Public Discord application ID -- not secret, but repo-specific. Serves as
  # BOTH the OAuth/login app and the bot app; they were consolidated onto one
  # application on 2026-09-21, retiring 1379923688094302339
  # ("gcoms-auth-test") entirely.
  #
  # PRODUCTION cutover value: 1257298573436125185 ("GamerComs bot"), replacing
  # the cluster's current 1326999027321012246 ("GComsTestBot"). Both confirmed
  # to exist via Discord's public application API.
  #
  # ** This is the single least reversible line in the cutover. **
  # The 30 guilds migrated from old production have THAT application's bot
  # installed. An application id is an identity, not an environment setting --
  # coming up on the test app means those guilds have no bot present at all,
  # and the way back is re-inviting it to 30 servers by hand. Confirm what old
  # production actually runs before merging: `grep DISCORD_CLIENT_ID
  # ~/gcoms/*/.env` on the old server, or decode the bot token's first segment
  # (it is the application id, base64).
  #
  # Three things must move together or login breaks outright rather than
  # degrading:
  #   1. this id;
  #   2. DISCORD_CLIENT_SECRET *and* DISCORD_API_TOKEN in gamercoms-secrets --
  #      the token exchange sends id+secret together, so a mismatched pair is
  #      a hard `invalid_client`. Write them with a real base64 encoder: shell
  #      quoting silently added a byte to a client secret here once, which
  #      authenticated from a laptop and failed from inside the pod;
  #   3. NEXT_PUBLIC_DISCORD_CLIENT_ID and NEXT_PUBLIC_DISCORD_BOT_CLIENT_ID,
  #      which are GitHub *repository variables* on Gamercoms-web, NOT entries
  #      in this ConfigMap. Next.js inlines them at BUILD time, so they need a
  #      rebuild -- a redeploy ships the old ids.
  DISCORD_CLIENT_ID: "1257298573436125185"

  # Weekly filled-queues leaderboard job (bot). GUILD_ID is "GamerComs
  # STAGING" (see gcoms-dir/CLAUDE.md's known-guilds list) -- these were
  # left as REPLACE_ME long enough to actually cause a live error (the
  # bot's code treats a truthy "REPLACE_ME" string as a real ID rather
  # than falling back to its own defaults, so it was trying to post to a
  # guild literally named "REPLACE_ME" and failing) -- caught via the new
  # Fluent Bit -> Grafana Cloud log pipeline.
  #
  # ** Left unchanged deliberately, and it needs a decision before cutover. **
  # This is the STAGING guild, and the bot application changes above. The
  # production bot ("GamerComs bot") is not necessarily a member of the
  # staging guild at all, so after cutover this job most likely stops working
  # rather than merely posting to the wrong place -- and if the production bot
  # IS in there, it posts real production activity into a test server every
  # week. Point it at whichever real community guild should receive the
  # leaderboard; not a value anyone but you can pick.
  WEEKLY_LEADERBOARD_GUILD_ID: "1336405641673183254"
  WEEKLY_LEADERBOARD_CHANNEL_ID: "1501505980469612644"
  WEEKLY_LEADERBOARD_TIMEZONE: "Europe/Stockholm"
  WEEKLY_LEADERBOARD_POST_DAY: "0"
  WEEKLY_LEADERBOARD_POST_HOUR: "19"
  WEEKLY_LEADERBOARD_POST_MINUTE: "0"

  # Optional analytics; leave empty to keep PostHog disabled.
  POSTHOG_HOST: ""

  # Nightly Mongo backup target (k8s/14-mongo-backup-cronjob.yaml). Not
  # secret by itself -- pair with the mongo-backup-object-storage Secret
  # (02-secret.example.yaml) for the actual access keys.
  # "gamerstore" is shared with other, unrelated projects on this account --
  # the access key is scoped to this specific pre-existing bucket, not a
  # dedicated one. See k8s/14-mongo-backup-cronjob.yaml for the gamercoms/
  # prefix this is uploaded under.
  MONGO_BACKUP_S3_BUCKET: "gamerstore"
  MONGO_BACKUP_S3_ENDPOINT: "https://se-sto-1.linodeobjects.com"

  # --- Build-time-baked, NOT just runtime config -----------------------------
  # These three are compiled into the frontend image at `next build` time
  # (NEXT_PUBLIC_* vars, and BACKEND_API_URL for the rewrite destination).
  # Setting them here only affects the *runtime* Server Component fetch
  # (BACKEND_API_URL) -- the frontend image build in CI must also pass them as
  # --build-arg, or the baked-in values will be wrong/missing regardless of
  # what's in this ConfigMap. See Gamercoms-web/CLAUDE.md notes on
  # BACKEND_API_URL for the same gotcha already documented there.
  # WARNING: these two have NO effect on the running frontend. NEXT_PUBLIC_*
  # variables are inlined by Next.js at BUILD time, so the values that actually
  # ship come from the build environment -- GitHub repository variables for CI
  # builds (Gamercoms-web: Settings -> Secrets and variables -> Actions ->
  # Variables), and .env.local for local dev. Changing them here changes
  # nothing until a rebuild, and a rebuild ignores these.
  #
  # They are kept, and kept correct, only so this file does not actively
  # mislead: an earlier wrong value here sent someone hunting in the wrong
  # place while the real setting sat in GitHub.
  #
  # BOT_CLIENT_ID must be the app whose bot TOKEN runs in this environment
  # (1326999027321012246). CLIENT_ID is the OAuth/login app, which is a
  # SEPARATE setting -- see DISCORD_CLIENT_ID below before changing it.
  NEXT_PUBLIC_DISCORD_CLIENT_ID: "1326999027321012246"
  NEXT_PUBLIC_DISCORD_BOT_CLIENT_ID: "1326999027321012246"
